<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanako Gallery</title>
<link rel="stylesheet" href="./assets/panel.css">
</head>
<body>
<div class="layout">
  <div class="topbar">
    <h1>📷 Gallery</h1>
    <input class="search-input" id="searchInput" placeholder="搜索图片..." oninput="debouncedSearch()">
    <button class="icon-btn" onclick="prePage()" style="font-size:12px" title="上一页">◀</button>
    <span class="stats" id="stats">—</span>
    <button class="icon-btn" onclick="nextPage()" style="font-size:12px" title="下一页">▶</button>
    <select class="sort-select" id="sortSelect" onchange="changeSort()">
      <option value="date_desc">日期 ↓</option>
      <option value="date_asc">日期 ↑</option>
      <option value="name_asc">名称 A-Z</option>
      <option value="name_desc">名称 Z-A</option>
      <option value="size_desc">大小 ↓</option>
      <option value="size_asc">大小 ↑</option>
    </select>
    <select class="sort-select" id="ratioFilter" onchange="applyRatioFilter()" style="max-width:70px">
      <option value="">全部</option>
      <option value="favorite">⭐ 收藏</option>
      <option value="wide">宽屏</option>
      <option value="tall">竖屏</option>
      <option value="square">方形</option>
    </select>
    <button class="icon-btn" onclick="toggleView()" id="viewBtn" title="切换视图">▦</button>
    <span class="zoom-grid-label">🔍</span>
    <input type="range" class="zoom-grid" id="gridZoom" min="120" max="350" value="180" oninput="changeGridSize()">
    <button class="icon-btn" onclick="toggleMasonry()" id="masonryBtn" title="瀑布流">⊞</button>
    <button class="icon-btn" id="vidToggle" onclick="toggleVid()" title="视频" style="font-size:12px;opacity:.5">🎬</button>
    <button class="icon-btn" id="timelineToggle" onclick="toggleTimeline()" title="时间轴" style="font-size:12px;opacity:.5">📅</button>
    <button class="icon-btn" onclick="openSettings()" title="设置">⚙️</button>
  </div>
  <div class="tagbar" id="tagbar">
    <span class="tag tag-all active" onclick="filterTag('')">全部</span>
  </div>
  <div class="scroll-area" id="scrollArea">
    <div class="loading" id="loading"><div class="spin"></div>加载中...</div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <span class="close" onclick="closeModal()">&times;</span>
  <div class="modal-content">
    <img id="modalImg" src="" alt="">
    <video id="modalVideo" controls hidden style="max-width:85vw;max-height:75vh;display:block"></video>
    <div class="zoom-bar">
      <button class="zoom-btn nav-btn" onclick="modalPrev()" title="上一张 (←)">◀</button>
      <span class="zoom-level" id="zoomLevel">100%</span>
      <button class="zoom-btn nav-btn" onclick="modalNext()" title="下一张 (→)">▶</button>
      <span class="nav-count" id="navCount"></span>
      <button class="zoom-btn" onclick="zoomImg(-0.25)">−</button>
      <button class="zoom-btn" onclick="zoomImg(0.25)">+</button>
      <button class="zoom-btn" onclick="resetZoom()">⊡</button>
      <button class="zoom-btn" onclick="toggleFavorite()" id="favBtn">☆</button>
    </div>
    <div class="modal-info">
      <div class="name" id="modalName"></div>
      <div class="path" id="modalPath"></div>
      <div class="detail-row"><span id="modalSize"></span><span id="modalDate"></span><span id="modalDim"></span></div>
      <div class="modal-tags" id="modalTags"></div>
      <div class="modal-actions" id="modalActions">
        <input type="text" id="renameInput" placeholder="重命名..." class="rename-input">
        <button class="modal-btn" onclick="renameImage()">✏️</button>
        <button class="modal-btn" onclick="aiSuggestName()">✨ 命名</button>
        <button class="modal-btn" onclick="deleteImage()" style="color:#c08070">删除</button>
        <button class="modal-btn" onclick="showGroupPanel()">📁 分组</button>
      </div>
      <div class="group-input" id="groupInput" hidden>
        <input type="text" id="groupInputField" placeholder="输入标签，逗号分隔" class="rename-input">
        <button class="modal-btn" onclick="addGroupTag()">➕ 添加</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeSettings()"></div>
<div class="settings" id="settings">
  <div class="settings-header">
    <h2>⚙️ 图库设置</h2>
    <button class="close-btn" onclick="closeSettings()">&times;</button>
  </div>
  <div class="settings-body">
    <div class="status-msg" id="statusMsg"></div>

    <div class="settings-group">
      <h3>图库根目录</h3>
      <input type="text" id="cfgGalleryRoot" placeholder="gallery">
    </div>

    <div class="settings-group">
      <h3>博客图片路径</h3>
      <input type="text" id="cfgBlogPath" placeholder="public/images/gallery">
    </div>

    <div class="settings-group">
      <h3>缩略图尺寸</h3>
      <input type="number" id="cfgThumbSize" placeholder="300">
    </div>

    <div class="settings-group">
      <h3>导入来源目录</h3>
      <div id="scanPathsList"></div>
      <button class="path-add-btn" onclick="addScanPath()">+ 添加目录</button>
    </div>

    <div class="settings-group">
      <h3>生成图来源</h3>
      <div id="genSourcesList" style="font-size:11px;color:#8a7a6a;line-height:1.7">检测中…</div>
      <button class="action-btn secondary" onclick="refreshGenSources()" style="margin-top:6px">🔄 重新检测</button>
    </div>

    <div class="settings-group">
      <h3>内置素材</h3>
      <div id="builtinSourcesList" style="font-size:11px;color:#8a7a6a;line-height:1.7">检测中…</div>
    </div>

    <div class="settings-group">
      <h3>操作</h3>
      <button class="action-btn primary" onclick="saveConfig()">💾 保存设置</button>
      <button class="action-btn secondary" onclick="triggerRebuild()">🔄 重建索引</button>
      <button class="action-btn secondary" onclick="triggerImport()">📥 import</button>
    </div>

    <div class="settings-group">
      <h3>导入链接</h3>
      <input type="text" id="importUrlInput" placeholder="https://...jpg" style="width:100%;background:#3d352e;border:1px solid #4d443b;border-radius:8px;padding:7px 10px;font-size:13px;color:#d4cdc4;outline:none;margin-bottom:6px">
      <div id="importPreview" style="width:100%;height:120px;background:#2a2520;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6a5a4a;font-size:11px;margin-bottom:6px;overflow:hidden">预览</div>
      <button class="action-btn secondary" onclick="previewImportUrl()">preview</button>
      <button class="action-btn primary" onclick="confirmImportUrl()">导入</button>
    </div>

    <div class="settings-group">
      <h3>外部图床链接</h3>
      <input type="text" id="extUrlInput" placeholder="https://i.imagehost.com/photo.jpg" style="width:100%;background:#3d352e;border:1px solid #4d443b;border-radius:8px;padding:7px 10px;font-size:13px;color:#d4cdc4;outline:none;margin-bottom:6px">
      <input type="text" id="extTagsInput" placeholder="标签（逗号分隔）" style="width:100%;background:#3d352e;border:1px solid #4d443b;border-radius:8px;padding:7px 10px;font-size:13px;color:#d4cdc4;outline:none;margin-bottom:6px">
      <button class="action-btn primary" onclick="addExternalUrl()">+ 添加外部</button>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal" id="deleteModal" onclick="if(event.target===this)closeDeleteModal()">
  <div class="modal-confirm">
    <p style="color:#ddd;font-size:14px;margin:0 0 16px">确认删除此图片？</p>
    <label style="display:flex;align-items:center;gap:8px;color:#c4b4a0;font-size:12px;margin-bottom:16px">
      <input type="checkbox" id="deleteFileToo"> 同时删除磁盘文件（不可恢复）
    </label>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="modal-btn" onclick="closeDeleteModal()">取消</button>
      <button class="modal-btn" style="color:#c08070" onclick="doDelete()">确认删除</button>
    </div>
  </div>
</div>

<script type="module" src="./assets/panel.js"></script>
</body>
</html>
